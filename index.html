<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="card greeting">
      <button id="theme-toggle" class="btn theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
      <p id="time" class="time">--:--:--</p>
      <p id="date" class="date"></p>
      <h1 id="greeting"></h1>
    </section>

    <section class="card">
      <h2>Focus Timer</h2>
      <p id="mode-label" class="mode-label">Focus</p>
      <p id="focus-task" class="focus-task"></p>
      <div id="timer-display" class="timer">25:00</div>
      <div class="row center">
        <button id="timer-start" class="btn primary">Start</button>
        <button id="timer-stop" class="btn">Stop</button>
        <button id="timer-reset" class="btn">Reset</button>
      </div>
      <form id="timer-form" class="row center timer-setting">
        <label for="timer-minutes">Focus minutes</label>
        <input id="timer-minutes" type="number" min="1" max="180" value="25" required>
        <button type="submit" class="btn">Set</button>
      </form>
    </section>

    <section class="card">
      <h2>Today</h2>
      <div class="stats">
        <div class="stat"><strong id="stat-sessions">0</strong><span>Sessions</span></div>
        <div class="stat"><strong id="stat-minutes">0</strong><span>Focus minutes</span></div>
        <div class="stat"><strong id="stat-done">0</strong><span>Tasks done</span></div>
        <div class="stat"><strong id="stat-streak">0</strong><span>Day streak</span></div>
      </div>
    </section>

    <section class="card">
      <h2>To-Do List</h2>
      <form id="task-form" class="row">
        <input id="task-input" type="text" placeholder="Add a new task" maxlength="100" required>
        <button type="submit" class="btn primary">Add</button>
      </form>
      <p id="task-message" class="message" role="alert"></p>
      <div class="row sort-row">
        <label for="task-sort">Sort by</label>
        <select id="task-sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A to Z</option>
          <option value="za">Z to A</option>
          <option value="status">Pending first</option>
        </select>
      </div>
      <ul id="task-list" class="list"></ul>
    </section>

    <section class="card">
      <h2>Quick Links</h2>
      <form id="link-form" class="row wrap">
        <input id="link-name" type="text" placeholder="Name" maxlength="30" required>
        <input id="link-url" type="text" placeholder="example.com" required>
        <button type="submit" class="btn primary">Add</button>
      </form>
      <p id="link-message" class="message" role="alert"></p>
      <div id="link-list" class="links"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
